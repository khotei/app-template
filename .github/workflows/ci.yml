name: CI

# Gate every pull request on any base, and every push to main.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.bun == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        bun: [pinned, latest]
    steps:
      - uses: actions/checkout@v7

      # pinned = the packageManager field in package.json
      - name: Setup Bun (pinned)
        if: matrix.bun == 'pinned'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Bun (latest)
        if: matrix.bun == 'latest'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.bun }}-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-${{ matrix.bun }}-

      # --frozen-lockfile fails CI if bun.lock is out of date.
      - name: Install
        run: bun install --frozen-lockfile

      # The gates are the Makefile's list; -k runs the rest past a red one. A fresh checkout makes
      # the migration gate strict: docs/knowledge/database.md › Migrations.
      - name: Check
        run: make -k check BIOME=ci
